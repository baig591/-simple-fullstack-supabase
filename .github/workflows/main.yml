cat > .github/workflows/main.yml << 'EOF'
name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Backend tests
        working-directory: ./backend
        run: |
          npm ci
          npm test

      - name: Dependency audit
        working-directory: ./backend
        run: npm audit --audit-level=critical

      - name: Frontend build check
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  build-scan-push:
    name: Build, Scan & Push
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        run: echo "IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t $IMAGE ./${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push image
        run: docker push $IMAGE

  deploy:
    name: Deploy to AWS
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/app","export TAG=${{ github.sha }}","docker compose pull","docker compose up -d"]'

      - name: Verify deployment
        run: |
          sleep 20
          curl --fail --retry 5 --retry-delay 5 http://${{ secrets.APP_HOST }}/health
EOF
