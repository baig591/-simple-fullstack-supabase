name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Backend tests
        working-directory: ./backend
        run: |
          npm ci
          npm test

      - name: Dependency audit
        working-directory: ./backend
        run: npm audit --audit-level=critical

      - name: Frontend build check
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  build-scan-push:
    name: Build, Scan & Push
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/simple-fullstack-supabase-${{ matrix.service }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t $IMAGE ./${{ matrix.service }}

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.69.2 image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            $IMAGE

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: docker push $IMAGE
